<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ParkMyRide - Contact Us</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #fff;
        margin: 0;
        padding: 0;
    }

    .container {
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
    }

    h1 {
        color: #a78bfa;
        text-align: center;
        margin-bottom: 20px;
    }

    .form-section {
        background: rgba(255,255,255,0.05);
        padding: 20px;
        border-radius: 10px;
    }

    input, textarea {
        width: 100%;
        padding: 12px 0px;
        margin: 10px 0;
        border-radius: 5px;
        border: none;
        background-color: #ded8f1;
        font-size: 1em;
    }

    textarea {
        height: 120px;
        resize: none;
    }

    button {
        width: 100%;
        padding: 12px;
        background: #7c3aed;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        font-size: 1em;
    }

    button:hover {
        background: #5b21b6;
    }

    
    #popup {
        display: none;
        position: fixed;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #1e293b;
        padding: 20px 30px;
        border-radius: 8px;
        text-align: center;
        border: 1px solid #7c3aed;
        box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    #popup button {
        margin-top: 15px;
        width: auto;
        padding: 10px 20px;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Contact Us</h1>
    <div class="form-section">
        <form id="contactForm">
            <input type="text" id="name" placeholder="Your Name" required>
            <input type="email" id="email" placeholder="Your Email" required>
            <input type="text" id="subject" placeholder="Subject" required>
            <textarea id="message" placeholder="Write your message..." required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </div>
</div>


<div id="popup">
    <h3>Your message has been sent successfully 🎉</h3>
    <p>Our team will get back to you soon.</p>
    <button onclick="closePopup()">OK</button>
</div>

<script>
    document.getElementById("contactForm").onsubmit = function(event) {
        event.preventDefault();
        document.getElementById("popup").style.display = "block";
        event.target.reset();
    };

    function closePopup() {
        document.getElementById("popup").style.display = "none";
    }
</script>

</body>
</html>
